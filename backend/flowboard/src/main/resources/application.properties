# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:flowboard_db}
spring.datasource.username=${DB_USER:flowboard_user}
spring.datasource.password=${DB_PASSWORD:flowboard_pass}


# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:default_secret_change_in_prod}
app.jwt.expiration-ms=86400000

# Server
server.port=8080

# SpringDoc
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.security.jwt.enabled=true